# Cloudflare Workers configuration for Next.js app deployed via @opennextjs/cloudflare.
# Run `npm run cf:build` then `npx wrangler deploy` (or `npm run cf:deploy`).

name = "CHANGE_ME"
main = ".open-next/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets generated by @opennextjs/cloudflare build.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Public env vars. NEXT_PUBLIC_* is exposed to the browser — do NOT put secrets here.
# Real secrets (AUTH0_SECRET, AUTH0_CLIENT_SECRET) belong in Cloudflare Secrets:
#   npx wrangler secret put AUTH0_SECRET
#   npx wrangler secret put AUTH0_CLIENT_SECRET
[vars]
NEXT_PUBLIC_API_BASE_URL = "https://CHANGE_ME-api.example.com/api/v1"

# Custom domain binding — Workers will respond to this hostname.
# Requires API Token permission: Zone > Workers Routes > Edit.
# [[routes]]
# pattern = "CHANGE_ME.example.com"
# custom_domain = true
